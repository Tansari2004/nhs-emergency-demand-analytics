name: Verify analytics pipeline

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-repro.txt
      - name: Download pinned NHS sources and build database
        run: python src/ingest.py
      - name: Export analytics and forecasts
        run: |
          python src/analyze.py
          python src/forecast.py
      - name: Validate outputs and forecast behavior
        run: |
          python src/validate.py
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify updated editable source
        run: |
          python scripts/build_powerbi_model.py
          python scripts/build_powerbi_report.py
          python scripts/verify_powerbi.py
          npm install --prefix "$RUNNER_TEMP/pbi-tools" --no-audit --no-fund @microsoft/powerbi-report-authoring-cli@0.5.0 @microsoft/powerquery-parser@4.0.1
          NODE_PATH="$RUNNER_TEMP/pbi-tools/node_modules" node scripts/verify_powerquery.cjs
          "$RUNNER_TEMP/pbi-tools/node_modules/.bin/powerbi-report-author" validate powerbi/upgrade/NHS_Analytics.pbip
